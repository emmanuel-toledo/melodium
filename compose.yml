services:
  app:
    build:
      context: ./app
      dockerfile: ../docker/app/Dockerfile
    ports:
      - "80:5173"
    volumes:
      - ./app:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped

  utility:
    build:
      context: ./docker/utility
    working_dir: /app
    volumes:
      - ./app:/app
    command: ["tail", "-f", "/dev/null"]